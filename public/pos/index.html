<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>S-35 | Punto de venta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #fafafa;
            --text: #0a0a0a;
            --muted: #737373;
            --border: #e5e5e5;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --radius: 8px;
            --font: "DM Sans", "Helvetica Neue", sans-serif;
            --font-display: "Instrument Serif", Georgia, serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            background: var(--bg-soft);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .shell {
            width: min(100%, 400px);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 36px 32px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .brand img { height: 22px; }
        .brand span { color: var(--muted); font-size: 13px; }
        h1 {
            margin: 0 0 6px;
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 32px;
            letter-spacing: -0.02em;
        }
        .sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
        label { display: grid; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
        input {
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            outline: none;
        }
        input:focus { border-color: #d4d4d4; }
        .input-wrap { position: relative; }
        .input-wrap input { width: 100%; padding-right: 42px; }
        .toggle {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border: none; background: transparent;
            color: var(--muted); cursor: pointer; border-radius: 6px;
        }
        .toggle:hover { color: var(--text); background: var(--bg-soft); }
        .btn {
            width: 100%; height: 42px; margin-top: 8px;
            border: none; border-radius: 6px;
            background: #0a0a0a; color: #fff;
            font: inherit; font-weight: 500; cursor: pointer;
        }
        .btn:hover { opacity: .88; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .error {
            display: none; margin-top: 14px; padding: 10px 12px;
            border-radius: 6px; border: 1px solid #fecaca;
            background: var(--danger-bg); color: var(--danger); font-size: 13px;
        }
        .back { text-align: center; margin-top: 20px; }
        .back a { color: var(--muted); text-decoration: none; font-size: 13px; }
        .back a:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="shell">
        <div class="brand">
            <img src="/Assets/Logotipo Principal.png" alt="S-35">
            <span>Punto de venta</span>
        </div>
        <h1>Bienvenido</h1>
        <p class="sub">Acceso al POS interno S-35</p>
        <form id="loginForm" autocomplete="off">
            <label>Usuario
                <input id="username" type="text" required autocapitalize="none" autocomplete="username" spellcheck="false">
            </label>
            <label>Contraseña
                <div class="input-wrap">
                    <input id="password" type="password" required autocomplete="current-password">
                    <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
                </div>
            </label>
            <button type="submit" class="btn" id="loginBtn">Ingresar</button>
            <div class="error" id="errorMessage" role="alert"></div>
        </form>
        <div class="back"><a href="/">← Volver al sitio</a></div>
    </div>
    <script>
        if (localStorage.getItem('s35_pos_token') || localStorage.getItem('s35_admin_token')) {
            window.location.replace('/pos/app');
        }
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verificando…';
            errorMessage.style.display = 'none';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                let data = {};
                try { data = await response.json(); } catch (_) {}
                if (!response.ok || !data.ok || !data.token) {
                    throw new Error(data.error || 'Credenciales inválidas');
                }
                localStorage.setItem('s35_pos_token', data.token);
                if (data.user) localStorage.setItem('s35_pos_user', JSON.stringify(data.user));
                window.location.href = '/pos/app';
            } catch (err) {
                errorMessage.textContent = err.message || 'Credenciales inválidas';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Ingresar';
            }
        });
        document.getElementById('toggle').addEventListener('click', function () {
            const i = document.getElementById('password');
            const icon = this.querySelector('i');
            if (i.type === 'password') { i.type = 'text'; icon.className = 'fa-solid fa-eye-slash'; }
            else { i.type = 'password'; icon.className = 'fa-solid fa-eye'; }
        });
    </script>
</body>
</html>
