<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | S-35 Colaboradores</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --panel-bg: radial-gradient(1000px 700px at 0% -10%, rgba(0, 119, 255, 0.10), transparent 60%),
                        radial-gradient(900px 700px at 120% 110%, rgba(0,0,0,0.10), transparent 60%);
        }
        body { background: var(--panel-bg), #0b0d10; color: #e8eaed; font-size: 14px; }
        .nav.visible.on-white-bg { background: transparent; box-shadow: none; }
        .nav .logo-image { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25)); }

        .admin-wrap { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
        .admin-header { display:flex; align-items:center; justify-content: space-between; padding: 16px var(--space-lg); }
        .logout-btn { background: linear-gradient(180deg, #0a66ff, #0053cc); color: #fff; border: 1px solid rgba(0,119,255,0.6); padding: 6px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; box-shadow: 0 8px 20px rgba(10,102,255,0.28); font-size: 13px; }

        .panel-container { max-width: 1100px; margin: 24px auto 48px; padding: 0 var(--space-lg); }
        .panel-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); overflow: hidden; }
        .panel-head { display:flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .panel-title { font-size: 1rem; font-weight: 600; color: #e8eaed; }
        .panel-sub { color: #a5a7ab; font-size: 11px; }
        .tools { display:flex; gap: 8px; align-items:center; }
        .search { position: relative; }
        .search input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); color: #e8eaed; padding: 8px 10px 8px 30px; border-radius: 10px; outline: none; width: 200px; font-size: 13px; }
        .search i { position:absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #8b8e94; }
        .refresh-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); color: #e8eaed; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }

        .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .messages-table { min-width: 780px; width: 100%; border-collapse: separate; border-spacing: 0; }
        .messages-table thead th { position: sticky; top: 0; background: rgba(255,255,255,0.04); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; font-weight: 600; color: #cfd1d4; font-size: 11px; padding: 10px 12px; }
        .messages-table tbody td { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 12px; color: #dde0e4; vertical-align: top; font-size: 13px; }
        /* Make message cell feel clickable */
        .messages-table tbody tr td:nth-child(5) { cursor: pointer; color: #dfe3e7; }
        .messages-table tbody tr:hover td:nth-child(5) { text-decoration: underline; color: #ffffff; }
        .messages-table tbody tr:hover { background: rgba(255,255,255,0.03); }
        .nowrap { white-space: nowrap; }
        .muted { color: #a5a7ab; font-size: 12px; }
        .danger-btn { background: #b91c1c; color: white; border: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .pill { display:inline-block; padding: 1px 6px; border-radius: 9999px; font-size: 11px; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
        .pill.no { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }

        /* Detail modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
        .modal-backdrop.show { display: flex; }
        .modal-card { width: 100%; max-width: 720px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); color: #e8eaed; }
        .modal-head { display:flex; align-items:center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .modal-title { font-size: 0.95rem; font-weight: 600; color: #e8eaed; }
        .close-btn { background: none; border: 1px solid rgba(255,255,255,0.18); color: #cfd1d4; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .modal-body { padding: 14px; display: grid; grid-template-columns: 1fr; gap: 10px; }
        .field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; }
        .field label { color: #a5a7ab; font-size: 11px; }
        .msg-box { white-space: pre-wrap; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); padding: 10px; border-radius: 12px; color: #dde0e4; font-size: 13px; }
        .link { color: #9cc2ff; text-decoration: none; }
        .link:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .panel-head { align-items: flex-start; gap: 10px; }
            .tools { width: 100%; justify-content: space-between; }
            .search input { width: 100%; }
            .field { grid-template-columns: 1fr; }
        }

        /* Desktop/tablet optimizations */
        @media (min-width: 641px) {
            /* Allow natural wrapping but avoid character-per-line in long strings */
            .messages-table tbody td { word-break: normal; overflow-wrap: anywhere; }
            /* Email column a bit narrower and wrap nicely */
            .messages-table tbody td:nth-child(3) { max-width: 180px; }
            /* Clamp message to 3 lines for readability */
            .messages-table tbody td:nth-child(5) {
                max-width: 560px;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
                white-space: normal;
            }
        }

        /* Mobile optimizations to avoid horizontal scroll */
        @media (max-width: 480px) {
            .table-wrap { overflow-x: hidden; }
            .messages-table { min-width: 100%; table-layout: fixed; display: block; }
            .messages-table thead { display: none; }
            .messages-table tbody { display: block; }
            .messages-table tbody tr { display: block; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); border-radius: 12px; margin: 8px 0; }
            .messages-table tbody td { display: block; padding: 6px 0; border: 0; }
            .messages-table tbody td::before { content: attr(data-col); display: block; color: #a5a7ab; font-size: 11px; margin-bottom: 2px; }
            .messages-table tbody td[data-col="Acciones"] { padding-top: 10px; }
            .messages-table tbody td[data-col="Acciones"] .danger-btn { width: auto; }
            .nowrap { white-space: normal; }
        }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <a href="index.html" aria-label="Inicio"><img src="./Assets/Logotipo Principal.png" alt="S-35 Technology" class="logo-image" style="height:28px"></a>
            <button id="logoutBtn" class="logout-btn">Salir</button>
        </header>

        <main class="panel-container">
            <section class="panel-card">
                <div class="panel-head">
                    <div>
                        <div class="panel-title">Mensajes de Contacto</div>
                        <div class="panel-sub">Máx 200 más recientes</div>
                    </div>
                    <div class="tools">
                        <div class="search">
                            <i class="fas fa-search"></i>
                            <input id="searchInput" type="text" placeholder="Buscar… (nombre, email, empresa)">
                        </div>
                        <button id="refreshBtn" class="refresh-btn" title="Actualizar"><i class="fas fa-rotate"></i></button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="messages-table">
                        <thead>
                            <tr>
                                <th class="nowrap">Fecha</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Empresa</th>
                                <th>Mensaje</th>
                                <th>Newsletter</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="messagesBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
            <div class="modal-head">
                <div class="modal-title" id="detailTitle">Detalle del Mensaje</div>
                <button id="detailClose" class="close-btn" type="button">Cerrar</button>
            </div>
            <div class="modal-body">
                <div class="field"><label>Fecha</label><div id="dFecha"></div></div>
                <div class="field"><label>Nombre</label><div id="dNombre"></div></div>
                <div class="field"><label>Email</label><div id="dEmail"></div></div>
                <div class="field"><label>Empresa</label><div id="dEmpresa"></div></div>
                <div class="field"><label>Newsletter</label><div id="dNewsletter"></div></div>
                <div class="field" style="grid-template-columns: 1fr;"><label>Mensaje</label><div id="dMensaje" class="msg-box"></div></div>
            </div>
        </div>
    </div>

    <script>
    function getToken() { return localStorage.getItem('s35_admin_token'); }
    function requireAuth() { if (!getToken()) window.location.href = 'admin-login.html'; }
    requireAuth();

    let allMessages = [];
    const msgIndex = new Map();

    function formatRelativeDate(isoOrDate) {
        const d = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
        const now = new Date();
        const ms = now - d;
        const oneMin = 60 * 1000;
        const oneHour = 60 * oneMin;
        const oneDay = 24 * oneHour;
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startOfTarget = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayDiff = Math.floor((startOfToday - startOfTarget) / oneDay);
        if (dayDiff === 0) {
            if (ms < oneMin) return 'hace segundos';
            if (ms < oneHour) return `hace ${Math.floor(ms / oneMin)} min`;
            return `hace ${Math.floor(ms / oneHour)} h`;
        }
        if (dayDiff === 1) return 'ayer';
        if (dayDiff === 2) return 'antier';
        if (dayDiff < 7) return `hace ${dayDiff} días`;
        const weeks = Math.floor(dayDiff / 7);
        if (weeks < 5) return `hace ${weeks} ${weeks === 1 ? 'semana' : 'semanas'}`;
        const months = Math.floor(dayDiff / 30);
        if (months < 12) return `hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
        const years = Math.floor(dayDiff / 365);
        return `hace ${years} ${years === 1 ? 'año' : 'años'}`;
    }
    function renderMessages(list) {
        const tbody = document.getElementById('messagesBody');
        tbody.innerHTML = '';
        list.forEach(m => {
            const tr = document.createElement('tr');
            const created = m.createdAt ? new Date(m.createdAt) : null;
            tr.setAttribute('data-id', m._id || '');
            msgIndex.set(m._id, m);
            const fecha = created ? created.toLocaleString() : '';
            const fullMsg = (m.mensaje || '').replace(/</g,'&lt;');
            const msgShort = fullMsg.length > 200 ? fullMsg.slice(0,200) + '…' : fullMsg;
            tr.innerHTML = `
                <td class="nowrap" data-col="Fecha" title="${fecha}">${created ? formatRelativeDate(created) : ''}</td>
                <td data-col="Nombre">${m.nombre || ''}</td>
                <td data-col="Email">${m.email || ''}</td>
                <td data-col="Empresa">${m.empresa || ''}</td>
                <td data-col="Mensaje">${msgShort}</td>
                <td data-col="Newsletter">${m.newsletter ? '<span class="pill">Sí</span>' : '<span class="pill no">No</span>'}</td>
                <td data-col="Acciones"><button class="danger-btn" data-id="${m._id}">Eliminar</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function loadMessages() {
        const resp = await fetch('/api/messages', { headers: { Authorization: 'Bearer ' + getToken() } });
        if (!resp.ok) { if (resp.status === 401) { localStorage.removeItem('s35_admin_token'); location.href = 'admin-login.html'; return; } alert('Error cargando mensajes'); return; }
        const data = await resp.json();
        allMessages = data.items || [];
        renderMessages(allMessages);
    }

    const tbodyEl = document.getElementById('messagesBody');
    tbodyEl.addEventListener('click', async (e) => {
        const delBtn = e.target.closest('button[data-id]');
        if (delBtn) {
            const id = delBtn.getAttribute('data-id');
            if (!confirm('¿Eliminar mensaje?')) return;
            const resp = await fetch('/api/messages?id=' + encodeURIComponent(id), { method: 'DELETE', headers: { Authorization: 'Bearer ' + getToken() } });
            if (resp.ok) loadMessages(); else alert('No se pudo eliminar');
            return;
        }
        const row = e.target.closest('tr[data-id]');
        if (row) {
            const id = row.getAttribute('data-id');
            const m = msgIndex.get(id);
            if (m) openDetail(m);
        }
    });

    // Detail modal logic
    const modal = document.getElementById('detailModal');
    const closeBtn = document.getElementById('detailClose');
    function openDetail(m) {
        const createdDate = m.createdAt ? new Date(m.createdAt) : null;
        const createdExact = createdDate ? createdDate.toLocaleString() : '';
        document.getElementById('dFecha').textContent = createdDate ? `${formatRelativeDate(createdDate)} (${createdExact})` : '';
        document.getElementById('dNombre').textContent = m.nombre || '';
        document.getElementById('dEmail').innerHTML = m.email ? `<a class="link" href="mailto:${m.email}">${m.email}</a>` : '';
        document.getElementById('dEmpresa').textContent = m.empresa || '';
        document.getElementById('dNewsletter').innerHTML = m.newsletter ? '<span class="pill">Sí</span>' : '<span class="pill no">No</span>';
        document.getElementById('dMensaje').textContent = m.mensaje || '';
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
    }
    function closeDetail(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
    closeBtn.addEventListener('click', closeDetail);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeDetail(); });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeDetail(); });

    document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.removeItem('s35_admin_token'); location.href = 'admin-login.html'; });

    document.getElementById('refreshBtn').addEventListener('click', loadMessages);
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = (e.target.value || '').toLowerCase();
        if (!q) { renderMessages(allMessages); return; }
        const filtered = allMessages.filter(m => {
            return [m.nombre, m.email, m.empresa, m.mensaje].some(v => (v||'').toLowerCase().includes(q));
        });
        renderMessages(filtered);
    });

    loadMessages();
    </script>
</body>
</html>
