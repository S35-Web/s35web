<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colaboradores | Ingresar</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --login-bg: radial-gradient(1200px 800px at 10% -10%, rgba(0, 119, 255, 0.12), transparent 60%),
                         radial-gradient(900px 600px at 110% 110%, rgba(0, 0, 0, 0.08), transparent 60%);
        }
        body { background: var(--login-bg), #0b0d10; color: var(--primary-white); }
        .login-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
        .login-header { display:flex; align-items:center; gap:12px; padding: 20px var(--space-lg); }
        .login-header img { height: 28px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25)); }
        .login-container { display:flex; align-items:center; justify-content:center; padding: 32px var(--space-lg); }
        .login-card {
            width: 100%; max-width: 420px; backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .login-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; color: #e8eaed; }
        .login-sub { font-size: 0.95rem; color: #b8b9bd; margin-bottom: 22px; }
        .input-wrap { position: relative; display:flex; align-items:center; }
        .input-icon { position:absolute; left: 12px; color: #8b8e94; }
        .login-input {
            width: 100%; padding: 12px 42px 12px 38px; border-radius: 12px; outline: none;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            color: #e8eaed; transition: border-color .15s ease, background .15s ease;
        }
        .login-input::placeholder { color: #8b8e94; }
        .login-input:focus { border-color: rgba(0,119,255,0.6); background: rgba(255,255,255,0.08); }
        .toggle-btn { position:absolute; right: 8px; background: none; border: none; color: #8b8e94; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
        .toggle-btn:hover { color:#c3c5c9; }
        .login-btn { width: 100%; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(0,119,255,0.6); background: linear-gradient(180deg, #0a66ff, #0053cc); color: white; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(10,102,255,0.35); }
        .login-btn:disabled { opacity: .7; cursor: not-allowed; box-shadow: none; }
        .footer-muted { text-align:center; color: #8b8e94; font-size: 12px; padding: 18px; }
        @media (max-width: 520px) { .login-card { padding: 22px; border-radius: 14px; } }
    </style>
    <script>
    function qs(sel){ return document.querySelector(sel); }
    function byId(id){ return document.getElementById(id); }
    async function doLogin(e){
        e.preventDefault();
        const password = byId('password').value.trim();
        const btn = qs('.login-btn');
        const original = btn.textContent;
        if (!password) return;
        btn.disabled = true; btn.textContent = 'Ingresando…';
        try {
            const resp = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
            const data = await resp.json();
            if (!resp.ok || !data.ok) throw new Error(data.error || 'Error de login');
            localStorage.setItem('s35_admin_token', data.token);
            window.location.href = 'admin.html';
        } catch (err) {
            alert('Credenciales inválidas');
        } finally {
            btn.disabled = false; btn.textContent = original;
        }
    }
    function togglePw(){
        const i = byId('password');
        const icon = qs('#toggle i');
        if (i.type === 'password') { i.type = 'text'; icon.className = 'fas fa-eye-slash'; }
        else { i.type = 'password'; icon.className = 'fas fa-eye'; }
    }
    document.addEventListener('DOMContentLoaded', () => {
        const form = byId('adminLoginForm');
        form.addEventListener('submit', doLogin);
        byId('password').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ doLogin(ev);} });
        qs('#toggle').addEventListener('click', togglePw);
    });
    </script>
    </head>
<body>
    <div class="login-shell">
        <header class="login-header">
            <a href="index.html" aria-label="Inicio">
                <img src="./Assets/Logotipo Principal.png" alt="S-35 Technology">
            </a>
        </header>

        <main class="login-container">
            <div class="login-card">
                <h1 class="login-title">Colaboradores</h1>
                <p class="login-sub" style="font-family: Helvetica, Arial, sans-serif; font-size: 0.85rem;">Bienvenido Colaborador, favor de ingresar tu contraseña:</p>
                <form id="adminLoginForm" autocomplete="off">
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input class="login-input" id="password" name="password" type="password" placeholder="Contraseña" required>
                        <button id="toggle" type="button" class="toggle-btn" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                    </div>
                    <button class="login-btn" type="submit">Ingresar</button>
                </form>
            </div>
        </main>

        <footer class="footer-muted">© S-35® Tech. Acceso restringido</footer>
    </div>
</body>
</html>
