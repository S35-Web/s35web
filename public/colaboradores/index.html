<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>S-35 | Colaboradores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --overlay: rgba(0,0,0,.55); }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; background: #000; }
        .page {
            min-height: 100vh;
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #000;
        }
        .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: saturate(0.9) brightness(0.9); }
        .overlay { position: absolute; inset: 0; background: radial-gradient(1200px 600px at 70% 20%, rgba(0,0,0,.15), transparent), linear-gradient(180deg, var(--overlay), rgba(0,0,0,.75)); }
        .card {
            position: relative;
            width: min(92vw, 420px);
            border-radius: 20px;
            background: transparent;
            padding: 48px 0;
        }
        .logo { display: grid; place-items: center; margin-bottom: 18px; }
        .logo img { height: 40px; width: auto; }
        .title { margin: 0 0 10px; color: #fff; font-weight: 300; letter-spacing: .4px; font-size: 28px; text-align: center; }
        .subtitle { margin: 0 0 28px; color: #bfbfbf; font-weight: 300; font-size: 14px; text-align: center; }
        .form { display: grid; gap: 20px; }
        .label { color: #e8e8e8; font-size: 12px; margin-bottom: 6px; letter-spacing: .3px; }
        .input-wrap { position: relative; }
        .input { width: 100%; padding: 16px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; outline: none; transition: border-color .2s, background .2s; font-weight: 300; font-size: 16px; }
        .input.with-toggle { padding-right: 46px; }
        .input::placeholder { color: #9aa0a6; }
        .input:focus { border-color: #4da3ff; background: rgba(255,255,255,.1); }
        .toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9aa0a6; cursor: pointer; padding: 8px; }
        .toggle-btn:hover { color: #e8e8e8; }
        .btn { width: 100%; padding: 16px 18px; border-radius: 12px; border: 0; background: linear-gradient(135deg,#0a84ff,#0066cc); color: #fff; font-weight: 500; letter-spacing: .2px; cursor: pointer; box-shadow: 0 12px 30px rgba(10,132,255,.25); transition: transform .15s ease; font-size: 15px; }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: .7; cursor: not-allowed; transform: none; box-shadow: none; }
        .error { display: none; margin-top: 0; border-radius: 12px; border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.08); color: #fca5a5; padding: 12px 14px; font-size: 13px; }
        .back { text-align: center; margin-top: 18px; }
        .back a { color: #c7c7c7; text-decoration: none; font-size: 13px; }
        .back a:hover { color: #fff; }
        @media (max-width: 640px) {
            .card { padding: 44px 24px; width: min(88vw, 440px); }
        }
    </style>
</head>
<body>
    <div class="page">
        <video class="bg-video" muted playsinline webkit-playsinline autoplay loop preload="metadata">
            <source src="/Assets/mezcla_optimized.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <div class="card">
            <div class="logo"><img src="/Assets/Logotipo Principal.png" alt="S-35 Technology"></div>
            <h1 class="title">Colaboradores</h1>
            <p class="subtitle">Panel de control interno S-35</p>
            <form class="form" id="loginForm" autocomplete="off">
                <div>
                    <div class="label">Usuario</div>
                    <input class="input" id="username" name="username" type="text" placeholder="Ingresa tu usuario" required autocapitalize="none" autocorrect="off" autocomplete="username" spellcheck="false">
                </div>
                <div>
                    <div class="label">Contraseña</div>
                    <div class="input-wrap">
                        <input class="input with-toggle" id="password" name="password" type="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                        <button id="toggle" type="button" class="toggle-btn" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn" id="loginBtn"><i class="fas fa-user-shield"></i> Ingresar</button>
                <div class="error" id="errorMessage" role="alert"></div>
            </form>
            <div class="back"><a href="/"><i class="fas fa-arrow-left"></i> Volver al sitio</a></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('s35_admin_token')) {
            window.location.replace('/colaboradores/panel');
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando…';
            errorMessage.style.display = 'none';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                let data = {};
                try { data = await response.json(); } catch (_) {}
                if (!response.ok || !data.ok || !data.token) {
                    throw new Error(data.error || 'Credenciales inválidas');
                }
                localStorage.setItem('s35_admin_token', data.token);
                if (data.user) localStorage.setItem('s35_admin_user', JSON.stringify(data.user));
                window.location.href = '/colaboradores/panel';
            } catch (err) {
                errorMessage.textContent = err.message || 'Credenciales inválidas';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-user-shield"></i> Ingresar';
            }
        });

        document.getElementById('toggle').addEventListener('click', function () {
            const i = document.getElementById('password');
            const icon = this.querySelector('i');
            if (i.type === 'password') { i.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { i.type = 'password'; icon.className = 'fas fa-eye'; }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const video = document.querySelector('.bg-video');
            if (!video) return;
            const hideVideo = function () { video.style.display = 'none'; };
            const tryPlay = function () {
                const p = video.play();
                if (p && typeof p.then === 'function') {
                    p.catch(function () {
                        hideVideo();
                        document.addEventListener('touchend', function once() {
                            video.style.display = '';
                            video.play().finally(function () {
                                document.removeEventListener('touchend', once);
                            });
                        }, { once: true });
                    });
                }
            };
            if (video.readyState >= 2) tryPlay();
            else video.addEventListener('canplay', tryPlay, { once: true });
            setTimeout(function () { if (video.paused) hideVideo(); }, 1200);
        });
    </script>
</body>
</html>
